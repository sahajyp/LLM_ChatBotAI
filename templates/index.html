<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyChat</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Apply saved theme before paint to avoid a flash.
    (function () {
      try {
        var saved = localStorage.getItem("mychat-theme");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MyChat home">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" class="brand-logo">
        <span class="brand-name">MyChat</span>
      </a>
      <div class="topbar-actions">
        <span class="model-pill" title="Model in use">{{ model_name }}</span>
        <button id="clear-btn" class="icon-btn" title="Clear conversation" aria-label="Clear conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
        <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <section class="welcome" id="welcome">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" class="welcome-logo">
        <h1>How can I help you today?</h1>
        <p>Ask me anything: write, learn, plan, or code.</p>
        <div class="chips">
          <button class="chip" data-prompt="Explain how the internet works like I'm 12 years old.">Explain a concept</button>
          <button class="chip" data-prompt="Write a polite email asking my professor for a deadline extension.">Draft an email</button>
          <button class="chip" data-prompt="Write a Python function that checks whether a string is a palindrome.">Write some code</button>
          <button class="chip" data-prompt="Give me 5 creative project ideas for a beginner portfolio.">Brainstorm ideas</button>
        </div>
      </section>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message MyChat..." maxlength="4000" aria-label="Message"></textarea>
        <button id="send-btn" type="submit" class="send-btn" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="disclaimer">MyChat runs a small open-source model and can make mistakes. Double-check important information.</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
